name: Deploy Nilasa Storefront to SmarterASP (Web Deploy)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Web Deploy
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://win6030.site4now.net/api/v1' }}

      - name: Package for IIS / SmarterASP.NET
        run: node scripts/package-iis.js --skip-build --keep-dist --skip-zip

      - name: Deploy to SmarterASP.NET via Web Deploy (MSDeploy)
        shell: powershell
        run: |
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          if (-not (Test-Path $msdeploy)) {
            $msdeploy = "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          }

          $siteName = "${{ secrets.SMARTERASP_SITE_NAME }}"
          if ([string]::IsNullOrWhiteSpace($siteName)) {
            $siteName = "faizanansari-001-subsite3"
          }

          $userName = "${{ secrets.SMARTERASP_USERNAME }}"
          if ([string]::IsNullOrWhiteSpace($userName)) {
            $userName = "faizanansari-001"
          }

          $password = "${{ secrets.SMARTERASP_PASSWORD }}"
          if ([string]::IsNullOrWhiteSpace($password)) {
            $password = "${{ secrets.FTP_PASSWORD }}"
          }

          $distPath = Join-Path (Get-Location) "dist-package"

          Write-Host "Deploying Next.js Storefront to SmarterASP via Web Deploy (site: $siteName)..."
          & $msdeploy -verb:sync `
            -source:contentPath="$distPath" `
            -dest:contentPath="$siteName",ComputerName="https://win6030.site4now.net:8172/msdeploy.axd",UserName="$userName",Password="$password",AuthType="Basic",IncludeAcls="False" `
            -allowUntrusted `
            -enableRule:DoNotDeleteRule
